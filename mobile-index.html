<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>elanrubin.com</title>
    <link rel="icon" type="image/x-icon" href="/images/star_favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/mobile.css" />
  </head>

  <body class="stage" data-scene>
    <!-- About Me window -->
    <div class="window glass">
      <div class="window-header">
        <span class="window-title">About Me</span>
      </div>
      <div class="window-content">
        Hello! My name is Elan, and I'm a student. My interests lie in the
        intersection between technology and art.
      </div>
    </div>

    <!-- App icons -->
    <div class="app-icons">
      <a
        href="https://www.linkedin.com/in/elan-rubin/"
        class="app-icon"
        target="_blank"
        ><div class="app-icon__tile glass">
          <i class="fa-brands fa-linkedin"></i>
        </div>
        <span>LinkedIn</span></a
      >

      <a href="https://github.com/Elan-Rubin" class="app-icon" target="_blank"
        ><div class="app-icon__tile glass">
          <i class="fa-brands fa-github"></i>
        </div>
        <span>GitHub</span></a
      >

      <a
        class="app-icon app-icon--disabled"
        aria-disabled="true"
        title="coming soon"
        ><i class="dnd" aria-hidden="true"></i>
        <div class="app-icon__tile glass">
          <i class="fa-solid fa-envelope"></i>
        </div>
        <span>Email</span></a
      >
      <a href="https://elanmakesgames.itch.io/" class="app-icon" target="_blank"
        ><div class="app-icon__tile glass">
          <i class="fa-brands fa-itch-io"></i>
        </div>
        <span>itch.io</span></a
      >

      <a
        href="https://www.etsy.com/shop/Legoco"
        class="app-icon"
        target="_blank"
        ><div class="app-icon__tile glass">
          <i class="fa-brands fa-etsy"></i>
        </div>
        <span>Etsy</span></a
      >

      <a
        href="https://www.instagram.com/elan_rubin/"
        class="app-icon"
        target="_blank"
        ><div class="app-icon__tile glass">
          <i class="fa-brands fa-instagram"></i>
        </div>
        <span>Instagram</span></a
      >
    </div>

    <!-- Taskbar -->
    <div class="taskbar">
      &copy;
      <script>
        document.write(new Date().getFullYear());
      </script>
      Elan &nbsp;|&nbsp; All rights reserved
    </div>
    <script type="module" src="/js/scene.js"></script>
  </body>
</html>
