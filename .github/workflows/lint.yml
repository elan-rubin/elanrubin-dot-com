name: Lint

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Check on main
        if: github.ref_name == 'main'
        run: npx eslint .

      - name: Fix
        if: github.ref_name != 'main'
        run: npx eslint . --fix

      - name: Commit changes
        if: github.ref_name != 'main'
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "style: auto-fix lint issues"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-run checks on fixed commit
        if: steps.commit.outputs.pushed == 'true'
        run: |
          for wf in format.yml lint.yml guard.yml; do
            if [ -f ".github/workflows/$wf" ]; then
              gh workflow run "$wf" --ref "$GITHUB_REF_NAME" || echo "::warning::could not dispatch $wf (it must exist on main first)"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
