<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>elanrubin.com</title>
    <!-- <script src="https://kit.fontawesome.com/2b9cdc1c9a.js" crossorigin="anonymous"></script> -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
      integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="/images/star_favicon.png" />

    <script src="/js/index.js"></script>

    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/desktop.css" />

    <script>
      //detect if not on the computer, and then redirect immediately
      (function () {
        if (
          /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
            navigator.userAgent,
          )
        ) {
          window.location.replace("mobile-index.html");
        }
      })();
    </script>
  </head>

  <body>
    <section id="desktopSection" class="stage">
      <div class="desktop-app-icons">
        <div class="app-icon desktop-icon" data-window="Calculator">
          <div class="app-icon__tile glass">
            <i class="fa-solid fa-calculator"></i>
          </div>
          <span>Calculator</span>
        </div>
        <div class="app-icon desktop-icon" data-window="Notepad">
          <div class="app-icon__tile glass">
            <i class="fa-solid fa-note-sticky"></i>
          </div>
          <span>Notepad</span>
        </div>
        <div class="app-icon desktop-icon" data-window="Playlist">
          <div class="app-icon__tile glass">
            <i class="fa-solid fa-music"></i>
          </div>
          <span>Playlist</span>
        </div>
        <div class="app-icon desktop-icon" data-window="Clicker">
          <div class="app-icon__tile glass">
            <i class="fa-solid fa-cookie-bite"></i>
          </div>
          <span>Clicker</span>
        </div>
      </div>
      <div class="app-icons">
        <a
          href="https://www.linkedin.com/in/elan-rubin/"
          class="app-icon"
          target="_blank"
          ><div class="app-icon__tile glass">
            <i class="fa-brands fa-linkedin"></i>
          </div>
          <span>LinkedIn</span></a
        >
        <a href="https://github.com/Elan-Rubin" class="app-icon" target="_blank"
          ><div class="app-icon__tile glass">
            <i class="fa-brands fa-github"></i>
          </div>
          <span>GitHub</span></a
        >
        <div></div>
        <a class="app-icon"
          ><div class="app-icon__tile glass">
            <i class="fa-solid fa-envelope"></i>
          </div>
          <span>Email</span></a
        >
        <a
          href="https://elanmakesgames.itch.io/"
          class="app-icon"
          target="_blank"
          ><div class="app-icon__tile glass">
            <i class="fa-brands fa-itch-io"></i>
          </div>
          <span>itch.io</span></a
        >
        <div></div>
        <a
          href="https://www.etsy.com/shop/Legoco"
          class="app-icon"
          target="_blank"
          ><div class="app-icon__tile glass">
            <i class="fa-brands fa-etsy"></i>
          </div>
          <span>Etsy</span></a
        >
        <a
          href="https://www.instagram.com/elan_rubin/"
          class="app-icon"
          target="_blank"
          ><div class="app-icon__tile glass">
            <i class="fa-brands fa-instagram"></i>
          </div>
          <span>Instagram</span></a
        >
      </div>
      <div
        class="window glass terminal"
        style="
          position: fixed;
          top: 24.5rem;
          left: 2rem;
          width: 19rem;
          z-index: 1000;
        "
      >
        <div class="window-header">
          <div class="window-title">Terminal</div>
          <div class="window-controls">
            <!-- this is a silly formality -->
            <button
              style="visibility: hidden"
              class="window-button minimize-btn"
            ></button>
            <button
              style="visibility: hidden"
              class="window-button maximize-btn"
            ></button>
            <button
              style="visibility: hidden"
              class="window-button close-btn"
            ></button>
          </div>
        </div>
        <div class="window-content glass-dark-content terminal-content">
          <div class="terminal-commands" id="terminalCommands"></div>
        </div>
      </div>

      <div
        class="window glass"
        style="
          top: calc(100vh - 20rem - 0.5rem + 1.5rem);
          left: calc(100vw - 39.5rem);
        "
      >
        <div class="window-header">
          <div class="window-title">Calculator</div>
          <div class="window-controls">
            <button class="window-button close-btn">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>
        <div class="window-content glass-content calculator">
          <input type="text" id="display" readonly />
          <div class="buttons">
            <button class="calc-button" onclick="appendToDisplay('7')">
              7
            </button>
            <button class="calc-button" onclick="appendToDisplay('8')">
              8
            </button>
            <button class="calc-button" onclick="appendToDisplay('9')">
              9
            </button>
            <button class="calc-button" onclick="appendToDisplay('+')">
              <i class="fa-solid fa-plus"></i>
            </button>
            <button class="calc-button" onclick="appendToDisplay('4')">
              4
            </button>
            <button class="calc-button" onclick="appendToDisplay('5')">
              5
            </button>
            <button class="calc-button" onclick="appendToDisplay('6')">
              6
            </button>
            <button class="calc-button" onclick="appendToDisplay('-')">
              <i class="fa-solid fa-minus"></i>
            </button>
            <button class="calc-button" onclick="appendToDisplay('1')">
              1
            </button>
            <button class="calc-button" onclick="appendToDisplay('2')">
              2
            </button>
            <button class="calc-button" onclick="appendToDisplay('3')">
              3
            </button>
            <button class="calc-button" onclick="appendToDisplay('*')">
              <i class="fa-solid fa-xmark"></i>
            </button>
            <button class="calc-button" onclick="appendToDisplay('0')">
              0
            </button>
            <button class="calc-button" onclick="clearDisplay()">C</button>
            <button class="calc-button" id="buttonEquals" onclick="calculate()">
              <i class="fa-solid fa-equals"></i>
            </button>
            <button class="calc-button" onclick="appendToDisplay('/')">
              <i class="fa-solid fa-divide"></i>
            </button>
          </div>
        </div>
      </div>

      <div
        class="window glass notepad"
        style="top: calc(1rem + 1.5rem); left: 22rem"
      >
        <div class="window-header">
          <div class="window-title">Notepad</div>
          <div class="window-controls">
            <button class="window-button close-btn">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>
        <div class="window-content glass-content" id="notepadContent"></div>
      </div>

      <div
        class="window glass"
        style="
          top: calc(50vh - 15rem);
          left: calc(50vw - 20rem);
          width: 40rem;
          height: 30rem;
          display: none;
        "
      >
        <div class="window-header">
          <div class="window-title">Clicker</div>
          <div class="window-controls">
            <button class="window-button close-btn">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>
        <div class="window-content glass-content cookie-game">
          <div class="cookie-column">
            <div class="cookie-counter">
              <span id="cookieCount">0</span> cookies
            </div>
            <button class="cookie-button" id="cookieButton">
              <img src="images/cookie_pink.png" alt="" />
              <!-- <i class="fas fa-cookie"></i> -->
            </button>
          </div>
          <div class="upgrades-column">
            <div class="upgrade-item">
              <button class="upgrade-button" id="clickUpgrade">
                <div class="upgrade-info">
                  <div class="upgrade-name">Better Clicking</div>
                  <div class="upgrade-desc">Clicks worth +1 cookie</div>
                  <div class="upgrade-cost">
                    Cost: <span id="clickUpgradeCost">10</span> cookies
                  </div>
                </div>
              </button>
            </div>
            <div class="upgrade-item">
              <button class="upgrade-button" id="autoUpgrade">
                <div class="upgrade-info">
                  <div class="upgrade-name">Auto Cookie</div>
                  <div class="upgrade-desc">Generate 1 cookie/sec</div>
                  <div class="upgrade-cost">
                    Cost: <span id="autoUpgradeCost">15</span> cookies
                  </div>
                </div>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- <link rel="stylesheet" href="/js/cookie.js"> -->
      <script src="/js/cookie.js"></script>

      <div
        class="window glass playlist-window"
        style="
          top: calc(100vh - 20rem - 0.5rem);
          left: calc(100vw - 20rem - 3.5rem);
        "
      >
        <div class="window-header">
          <div class="window-title">Playlist</div>
          <div class="window-controls">
            <button class="window-button close-btn">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>
        <div>
          <div class="music-player" id="musicPlayer">
            <div class="playlist" id="playlist">
              <!-- life - jamie xx ft. robyn -->
              <!-- the winans - aint no need to worry -->
              <!-- lexa gates ft. billy lemos - i just cant be alone -->
              <!-- clairo - juna -->
              <div class="playlist-item" data-src="/music/clairo.mp3">
                Clairo - Juna
              </div>
              <div class="playlist-item" data-src="/music/jamie.mp3">
                Jamie xx - Life
              </div>
              <div class="playlist-item" data-src="/music/winans.mp3">
                The Winans - Ain't no Need to Worry
              </div>
              <div class="playlist-item" data-src="/music/lexa.mp3">
                Lexa Gates - I Just can't be Alone
              </div>
            </div>
            <div class="controls">
              <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
              </div>
              <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
              </div>
              <div class="control-buttons">
                <button class="control-button" id="prevButton">
                  <i class="fa-solid fa-backward"></i>
                </button>
                <button class="control-button" id="playButton">
                  <i class="fa-solid fa-play"></i>
                </button>
                <button class="control-button" id="nextButton">
                  <i class="fa-solid fa-forward"></i>
                </button>
              </div>
            </div>
          </div>

          <audio id="audioPlayer"></audio>
        </div>
      </div>
      <script src="/js/musicplayer.js"></script>
      <!-- is this supposed to be here ^^ -->
      <!-- lol i guess cause it works -->
    </section>
    <div id="taskBar">
      <div id="taskBarItems">
        <div class="task-bar-icon">
          <i class="fa-solid fa-wifi"></i>
        </div>
        <div class="task-bar-icon">
          <i id="volumeIcon" class="fa-solid fa-volume-high"></i>
        </div>
        <div id="timeDisplay"></div>
      </div>
      <div id="taskBarItemsRight">
        <div>
          <script>
            document.write(new Date().getFullYear());
          </script>
          | All rights reserved
        </div>
      </div>
    </div>
    <!-- <section id="section2">
        <div style="background-color: red; padding: 2rem;">asd;ljkfjas;dlf</div>
    </section> -->
    <script src="/js/components.js"></script>
  </body>
</html>
